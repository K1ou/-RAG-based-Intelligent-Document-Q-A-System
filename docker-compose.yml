services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_ui
    command: python scripts/run_ui.py --api-base-url http://api:8000 --host 0.0.0.0 --port 7860
    ports:
      - "7860:7860"
    depends_on:
      - api
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
